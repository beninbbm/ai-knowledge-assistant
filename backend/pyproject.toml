[project]
name = "knowledge-assistant"
version = "0.1.0"
description = "Local RAG assistant: ask questions about your documents and get cited answers"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "fastapi-users[sqlalchemy]>=15",
    "httpx>=0.28.1",
    "markdown-it-py>=4.2.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs real Ollama running"]
filterwarnings = [
    # Harmless noise from PyMuPDF's compiled bindings on Python 3.12+.
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.4",
]

[tool.ruff.lint.per-file-ignores]
# Migrations are generated by Alembic; long lines there are fine.
"alembic/versions/*" = ["E501"]
