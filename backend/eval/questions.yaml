# Golden questions for evaluating the assistant against the documents in samples/.
#
# Each case:
#   question:  what the user asks
#   category:  direct | table | paraphrase | multi-document | follow-up | unanswerable
#   document:  the sample file the answer should come from
#   headings:  the section(s) holding the answer (last heading of the chunk); any one counts
#   facts:     regular expressions (case-insensitive) that must ALL appear in the answer;
#              use a|b for acceptable alternatives
#   history:   for follow-ups, the earlier questions in the conversation
#
# Unanswerable cases have no document: the right response is to say it isn't there.

